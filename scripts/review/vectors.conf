# Review vector registry — single source of truth for whole-app review vectors.
# Columns:  name | prefix | scan_profile | axis
# Derived by convention (never store separately):
#   methodology_doc = docs/review/${prefix}_METHODOLOGY.md
#   deliverable     = docs/${prefix}_${MODEL_SLUG}_${DATE}.md
# Consumed by scripts/review/lib.sh (lookup_vector); pick a row with:
#   pnpm review:freeze <name>   e.g. pnpm review:freeze trust
# Fields are pipe-delimited; surrounding whitespace is trimmed. Axis is free text
# (no pipe characters). Adding a vector also needs a scan profile, methodology,
# and skill overlay.

architecture      | WHOLE_APP_ARCHITECTURE_REVIEW           | architecture           | DRY / consistency / maintainability / extensibility
trust             | WHOLE_APP_TRUST_BOUNDARY_REVIEW         | trust                  | authorization, scope, validation, race safety, audit invariants
domain-invariants | WHOLE_APP_DOMAIN_INVARIANTS_REVIEW      | domain-invariants      | domain state validity, transition integrity, audit completeness
contracts         | WHOLE_APP_CONTRACTS_REVIEW              | contracts              | cross-boundary contract stability (API, hooks, packages, report-server)
validation        | WHOLE_APP_VALIDATION_TESTABILITY_REVIEW | validation-testability | validation consistency, data-shape single source of truth, testability and coverage gaps
pii               | WHOLE_APP_PII_DATA_EXPOSURE_REVIEW      | pii-data               | PII minimization, export/download exposure, and sensitive-data handling
async-reliability | WHOLE_APP_ASYNC_RELIABILITY_REVIEW      | async-reliability      | async job lifecycle, webhook idempotency, retry safety, and partial-failure recovery
migration         | WHOLE_APP_MIGRATION_DATA_EVOLUTION_REVIEW | migration-data-evolution | schema/data evolution, enum rollout, backfill safety, and compatibility
operations        | WHOLE_APP_OPERATIONS_READINESS_REVIEW   | operations-readiness   | environment hygiene, observability, deploy assumptions, and recovery paths
data-lifecycle    | WHOLE_APP_DATA_LIFECYCLE_RETENTION_REVIEW | data-lifecycle-retention | generated report files, uploads, presigned URLs, invite/token expiry, stale S3 objects, audit retention, archive/delete behavior, and privacy-preserving cleanup
frontend-state    | WHOLE_APP_FRONTEND_STATE_INTERACTION_REVIEW | frontend-state-interaction | client state correctness: stale cache, optimistic UI, double submit, destructive-action confirmation, loading/error state, undo, and server/client permission or workflow drift
accessibility     | WHOLE_APP_ACCESSIBILITY_MOBILE_REVIEW   | accessibility-mobile   | keyboard paths, form labels, modal focus/description, responsive layout and table overflow, and screen-reader clarity on dense operational and mobile admin workflows
dev-experience    | WHOLE_APP_DEV_EXPERIENCE_REPRODUCIBILITY_REVIEW | dev-experience-reproducibility | setup drift, seed data, test database ergonomics, scripts that require external state, and whether a new contributor can reproduce review findings
